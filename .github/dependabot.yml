version: 2

# All ecosystems check Monday 06:00 so the week's PRs land as one batch.
# `cooldown` covers version updates only — security PRs bypass it.
updates:
  # Python/uv dependencies (server)
  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python:uv
    reviewers:
      - vianneybacoup
      - Quentin-L-Inge
      - gmalonga
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Bloquer les major bumps automatiques (risque de breaking changes)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-patch:
        update-types:
          - "patch"
      python-minor:
        update-types:
          - "minor"

  # Frontend dependencies. The `npm` ecosystem is what covers bun, but in
  # practice Dependabot bumps `package.json` here and leaves `bun.lock`
  # untouched, which fails the `--frozen-lockfile` gate in `front-ci`. The
  # `dependabot-lockfile.yml` workflow regenerates and pushes the lockfile on
  # Dependabot's behalf. Note that bun is supported for version updates only —
  # Dependabot never opens *security* update PRs for it.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
    open-pull-requests-limit: 4
    labels:
      - dependencies
      - npm
    reviewers:
      - vianneybacoup
      - Quentin-L-Inge
      - gmalonga
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Bloquer les major bumps automatiques (risque de breaking changes)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-production-patch:
        dependency-type: "production"
        update-types:
          - "patch"
      npm-production-minor:
        dependency-type: "production"
        update-types:
          - "minor"
      npm-dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Browser extension: same bun-only lockfile contract as the frontend, so the
  # same `dependabot-lockfile.yml` workflow regenerates `extension/bun.lock`
  # after Dependabot edits `extension/package.json`.
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
    open-pull-requests-limit: 4
    labels:
      - dependencies
      - npm
    reviewers:
      - vianneybacoup
      - Quentin-L-Inge
      - gmalonga
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Bloquer les major bumps automatiques (risque de breaking changes)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      extension-production-patch:
        dependency-type: "production"
        update-types:
          - "patch"
      extension-production-minor:
        dependency-type: "production"
        update-types:
          - "minor"
      extension-dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions
    reviewers:
      - vianneybacoup
      - Quentin-L-Inge
      - gmalonga
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    reviewers:
      - vianneybacoup
      - Quentin-L-Inge
      - gmalonga
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Bloquer les major bumps automatiques (risque de breaking changes)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-patch:
        update-types:
          - "patch"
      docker-minor:
        update-types:
          - "minor"
