version: 2

# All ecosystems check Monday 06:00 so the week's PRs land as one batch.
# `cooldown` covers version updates only — security PRs bypass it.
updates:
  # Python/uv dependencies (server)
  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python:uv
    reviewers:
      - vianneybacoup
      - Quentin-L-Inge
      - gmalonga
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Bloquer les major bumps automatiques (risque de breaking changes)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-patch:
        update-types:
          - "patch"
      python-minor:
        update-types:
          - "minor"

  # Frontend dependencies. `bun` is its own ecosystem: `npm` refuses a
  # directory holding only `bun.lock`. Bun gets version updates only, never
  # security updates, so the `bun audit` gate in CI stays the safety net, and
  # `groups` cannot filter on `dependency-type`.
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
    open-pull-requests-limit: 4
    labels:
      - dependencies
      - npm
    reviewers:
      - vianneybacoup
      - Quentin-L-Inge
      - gmalonga
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Bloquer les major bumps automatiques (risque de breaking changes)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-patch:
        update-types:
          - "patch"
      frontend-minor:
        update-types:
          - "minor"

  # Browser extension: same bun-only lockfile contract as the frontend.
  - package-ecosystem: bun
    directory: /extension
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
    open-pull-requests-limit: 4
    labels:
      - dependencies
      - npm
    reviewers:
      - vianneybacoup
      - Quentin-L-Inge
      - gmalonga
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Bloquer les major bumps automatiques (risque de breaking changes)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      extension-patch:
        update-types:
          - "patch"
      extension-minor:
        update-types:
          - "minor"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions
    reviewers:
      - vianneybacoup
      - Quentin-L-Inge
      - gmalonga
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    reviewers:
      - vianneybacoup
      - Quentin-L-Inge
      - gmalonga
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Bloquer les major bumps automatiques (risque de breaking changes)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-patch:
        update-types:
          - "patch"
      docker-minor:
        update-types:
          - "minor"
