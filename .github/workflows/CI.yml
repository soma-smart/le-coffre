name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front-ci:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Install dependencies
        id: install
        working-directory: frontend/
        run: |
          if bun install --frozen-lockfile; then
            exit 0
          fi

          # bun.lock is the only frontend lockfile — CI, the Dockerfile and
          # Dependabot all work from it. Reaching here means package.json was
          # edited without regenerating it.
          tee -a "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### ❌ Frontend dependencies are out of sync

          `bun install --frozen-lockfile` refused to install: `frontend/bun.lock` disagrees with `frontend/package.json`.

              cd frontend && bun install && git add bun.lock
          EOF
          exit 1

      - name: Run Linting
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: frontend/
        run: bunx eslint .

      - name: Check Formatting
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: frontend/
        run: bunx prettier --check src/

      # Shared with the extension job. The script exists so that "the audit
      # found something" and "the audit could not reach the advisory API" stay
      # two different outcomes; inline, they were the same JSON.parse crash.
      - name: Check Dependencies Security
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: node .github/scripts/check-bun-audit.mjs frontend

      - name: Run Unit + Component Tests
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: frontend/
        run: bunx vitest run

      # `bun run build` already runs vue-tsc via `run-p type-check build-only`,
      # so a dedicated type-check step is not just redundant — it silently
      # populates .tsbuildinfo and masks cold-start failures that the
      # Dockerfile's `bun run build` would hit on a clean filesystem.
      - name: Type Check + Build Project
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: frontend/
        run: bun run build

  extension-ci:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: extension/package.json

      - name: Install dependencies
        id: install
        working-directory: extension/
        run: |
          if bun install --frozen-lockfile; then
            exit 0
          fi

          # Same contract as the frontend: bun.lock is the only lockfile, and
          # CI installs from it. Reaching here means package.json was edited
          # without regenerating it.
          tee -a "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### ❌ Extension dependencies are out of sync

          `bun install --frozen-lockfile` refused to install: `extension/bun.lock` disagrees with `extension/package.json`.

              cd extension && bun install && git add bun.lock
          EOF
          exit 1

      - name: Run Linting
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: extension/
        run: bunx eslint .

      - name: Check Formatting
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: extension/
        run: bunx prettier --check src/ scripts/

      - name: Check Architecture
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: extension/
        run: ./scripts/check-architecture.sh

      # Shared with the frontend job. The script exists so that "the audit
      # found something" and "the audit could not reach the advisory API" stay
      # two different outcomes; inline, they were the same JSON.parse crash.
      - name: Check Dependencies Security
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: node .github/scripts/check-bun-audit.mjs extension

      - name: Run Unit Tests
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: extension/
        run: bunx vitest run

      # `bun run build` chains vue-tsc, vite build and validate-manifest.ts.
      # That last step is the one that matters most here: it fails the build if
      # `host_permissions` is ever non-empty, if a permission outside the
      # reviewed allowlist appears, or if the bundle contains an inline script
      # or eval() that MV3's CSP would block at runtime with no build error.
      - name: Type Check + Build + Validate Manifest
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: extension/
        run: bun run build

  back-ci:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Install dependencies
        id: install
        working-directory: server/
        run: |
          if uv sync --frozen --group monitoring; then
            exit 0
          fi

          tee -a "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### ❌ Backend dependencies are out of sync

          `uv sync --frozen --group monitoring` refused to install: `server/uv.lock` disagrees with `server/pyproject.toml`.

              cd server && uv lock && git add uv.lock
          EOF
          exit 1

      - name: Check Formatting
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: server/
        run: uv run ruff format --check .

      - name: Run Linting
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: server/
        run: uv run ruff check .

      - name: Check Alembic Migrations
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: server/
        run: |
          # First, upgrade the database to the current head
          uv run alembic upgrade head

          # Generate a new migration to check if schema is in sync
          uv run alembic revision --autogenerate -m "CI check" > /tmp/migration_output.txt

          # Get the generated migration file
          MIGRATION_FILE=$(ls -t alembic/versions/*.py | head -1)

          # Check if the migration contains any actual changes
          # A migration with no changes will only have the boilerplate code
          if grep -q "op.create_table\|op.drop_table\|op.add_column\|op.drop_column\|op.alter_column\|op.create_index\|op.drop_index\|op.create_constraint\|op.drop_constraint" "$MIGRATION_FILE"; then
            echo "❌ ERROR: Database schema is not in sync with migrations!"
            echo "The following migration file was generated:"
            cat "$MIGRATION_FILE"
            echo ""
            echo "Please create a new Alembic migration for your schema changes:"
            echo "  cd server"
            echo "  uv run alembic revision --autogenerate -m 'Your migration description'"
            exit 1
          else
            echo "✅ Database schema is in sync with migrations"
          fi

          # Clean up the generated migration file
          rm "$MIGRATION_FILE"

      - name: Check Dependencies Security
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: server/
        run: |
          uv export --format requirements-txt --no-hashes > /tmp/requirements.txt

          set +e
          uvx pip-audit -r /tmp/requirements.txt --format=json --output /tmp/pip_audit.json
          pip_audit_status=$?
          set -e

          if [ "$pip_audit_status" -ne 0 ] && [ "$pip_audit_status" -ne 1 ]; then
            echo "❌ pip-audit failed with unexpected exit code: $pip_audit_status"
            exit "$pip_audit_status"
          fi

          cat > /tmp/check_pip_audit.py << 'EOF'
          import json, os, sys

          report_path = '/tmp/pip_audit.json'

          if not os.path.exists(report_path):
              print(f'❌ pip-audit did not produce the expected report: {report_path}', file=sys.stderr)
              sys.exit(1)

          try:
              with open(report_path) as f:
                  data = json.load(f)
          except json.JSONDecodeError as exc:
              print(f'❌ pip-audit report is not valid JSON: {exc}', file=sys.stderr)
              sys.exit(1)
          except OSError as exc:
              print(f'❌ Failed to read pip-audit report {report_path}: {exc}', file=sys.stderr)
              sys.exit(1)

          fixable = [
              (d['name'], d['version'], v['id'], v['fix_versions'])
              for d in data.get('dependencies', [])
              for v in d.get('vulns', [])
              if v.get('fix_versions')
          ]
          if fixable:
              print('❌ Vulnerabilities with available fixes:')
              for name, ver, vid, fixes in fixable:
                  print(f'  {name} {ver}: {vid} -> fix available: {", ".join(fixes)}')
              sys.exit(1)
          print('✅ No vulnerabilities with available fixes (any unfixable vulnerabilities are ignored)')
          EOF
          python3 /tmp/check_pip_audit.py

      - name: Run Unit Tests
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: server/
        run: uv run pytest .

  back-ci-no-monitoring:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Install dependencies (without monitoring group)
        id: install
        working-directory: server/
        run: |
          if uv sync --frozen; then
            exit 0
          fi

          tee -a "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### ❌ Backend dependencies are out of sync

          `uv sync --frozen` refused to install: `server/uv.lock` disagrees with `server/pyproject.toml`.

              cd server && uv lock && git add uv.lock
          EOF
          exit 1

      - name: Check Formatting
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: server/
        run: uv run ruff format --check .

      - name: Run Linting
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: server/
        run: uv run ruff check .

      - name: Run Unit Tests
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: server/
        run: uv run pytest .

  openapi-sync-check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Install Python dependencies
        working-directory: server/
        run: uv sync --frozen --group monitoring

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend/
        run: bun install --frozen-lockfile

      - name: Start FastAPI server
        working-directory: server/
        run: |
          # Start FastAPI in background
          uv run fastapi dev src/main.py --host 0.0.0.0 --port 8000 &
          FASTAPI_PID=$!
          echo "FASTAPI_PID=$FASTAPI_PID" >> $GITHUB_ENV
          echo "FastAPI started with PID: $FASTAPI_PID"

          # Wait for the server to be ready
          echo "Waiting for FastAPI to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/api/docs > /dev/null 2>&1; then
              echo "✅ FastAPI is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ FastAPI failed to start in time"
              exit 1
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Check OpenAPI client sync
        working-directory: frontend/
        run: |
          # Generate the OpenAPI client
          echo "Generating OpenAPI client..."
          bun run openapi-ts

          # Check if any files changed
          if [ -n "$(git status --porcelain src/client)" ]; then
            echo "❌ ERROR: OpenAPI client is out of sync!"
            echo ""
            echo "The following files have changes:"
            git status --short src/client
            echo ""
            echo "Diff:"
            git diff src/client
            echo ""
            echo "Please regenerate the OpenAPI client and commit the changes:"
            echo "  1. Make sure the backend is running: cd server && uv run fastapi dev src/main.py"
            echo "  2. Generate the client: cd frontend && bun run openapi-ts"
            echo "  3. Commit the changes: git add frontend/src/client && git commit"
            exit 1
          else
            echo "✅ OpenAPI client is in sync"
          fi

      - name: Stop FastAPI server
        if: always()
        run: |
          if [ -n "$FASTAPI_PID" ]; then
            kill $FASTAPI_PID 2>/dev/null || true
          fi
